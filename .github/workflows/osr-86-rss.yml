name: osr-86-rss-samples
on:
  push:
    branches: [osr-86-rss]
jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update && sudo apt-get install -y gcc make zlib1g-dev poppler-utils python3 time
      - name: build
        run: make xml2pdf
      - name: five large_proof runs
        run: |
          git rev-parse HEAD
          gcc --version | head -1
          for i in 1 2 3 4 5; do
            echo "SAMPLE $i"
            python3 tests/large_proof.py 1073741824
          done
