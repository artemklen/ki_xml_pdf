name: ci

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: tools
        run: sudo apt-get update && sudo apt-get install -y gcc g++ make zlib1g-dev
      - name: summary
        run: |
          git rev-parse HEAD
          gcc --version | head -1
          g++ --version | head -1
      - name: compile CLI, library and example
        run: |
          make clean
          make xml2pdf example
          make libki_xml_pdf.so

  source:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: source archive and provenance
        id: source
        run: |
          make dist
          archive_name=$(make -s print-dist-name)
          sha256sum "$archive_name" > SHA256SUMS
          git rev-parse HEAD > SOURCE_COMMIT
          printf 'archive=%s\n' "$archive_name" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$(make -s print-version)" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$(cat SOURCE_COMMIT)" >> "$GITHUB_OUTPUT"
          gzip -dc "$archive_name" | git get-tar-commit-id | cmp - SOURCE_COMMIT
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ki_xml_pdf-${{ steps.source.outputs.version }}-source-${{ steps.source.outputs.sha }}
          path: |
            ${{ steps.source.outputs.archive }}
            SHA256SUMS
            SOURCE_COMMIT
          if-no-files-found: error
